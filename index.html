<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive Adams chart for Ext over the mod-2 Steenrod algebra through internal degree t = 350, with multiplication by h_0 through h_8.">
  <title>Ext_𝒜 through t = 350</title>
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <header class="toolbar">
    <div class="identity">
      <strong class="chart-title">
        <math class="math-expression" aria-label="Ext over the Steenrod algebra A">
          <msub><mi mathvariant="normal">Ext</mi><mi>𝒜</mi></msub>
        </math>
      </strong>
      <span id="dataset-meta">Loading canonical data</span>
    </div>
    <div
      id="action-toggles"
      class="action-toggles"
      aria-label="Exact single-basis-element multiplication lines"
      title="A line is shown only when multiplication by h_i equals one basis element."
    ></div>
    <form id="search-form" class="search" role="search">
      <input
        id="search-input"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="m + digits"
        title="Enter m followed by digits, for example m68130"
        aria-label="Search for a basis element by its m number"
        disabled
      >
      <button id="search-button" type="submit" disabled>Search</button>
    </form>
    <div class="view-tools" aria-label="Chart view">
      <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="fit-view" type="button" title="Fit all basis elements">Fit</button>
    </div>
  </header>

  <main class="workspace">
    <section class="plot-shell" aria-label="Adams chart">
      <canvas id="chart"></canvas>
      <div id="hover-label" class="hover-label" hidden></div>
      <div id="loading" class="loading">Reading chart data</div>
      <div class="axis-label axis-x">stem <math aria-label="t minus s"><mrow><mi>t</mi><mo>−</mo><mi>s</mi></mrow></math></div>
      <div class="axis-label axis-y">filtration <math aria-label="s"><mi>s</mi></math></div>
    </section>
    <aside id="inspector" class="inspector">
      <div class="inspector-head">
        <span class="eyebrow">Selected basis element</span>
        <strong id="selected-name">None</strong>
      </div>
      <dl id="selected-details" class="details"></dl>
      <div id="selected-actions" class="selected-actions"></div>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="viewport-status"></span>
    <span id="render-status"></span>
  </footer>
  <script src="app.js?v=10"></script>
</body>
</html>
